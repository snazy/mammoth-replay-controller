name: Controller tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: controller
      # The Nessie seed commit, for the structural overlay tests.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: projectnessie/nessie
          ref: f400e1dfddd6336f30a54c688529d4d70bcfc607
          path: nessie
      - name: Unit tests
        working-directory: controller
        env:
          NESSIE_CHECKOUT: ${{ github.workspace }}/nessie
        run: python3 -m unittest discover -s tests -t . -v
